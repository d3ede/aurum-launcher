[package]
name = "aurum-social"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[features]
lab = []

[dependencies]
anyhow = "1"
age = { version = "0.11", default-features = false, features = ["armor"] }
base64 = "0.22"
bech32 = "0.11"
pkarr = { version = "8.1", default-features = false, features = ["signed_packet"] }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Registry", "Win32_NetworkManagement_WindowsFirewall", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
