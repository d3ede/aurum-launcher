[package]
name = "aurum-social-worker"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
aurum-social = { path = "../aurum-social", features = ["lab"] }
anyhow = "1"
base64 = "0.22"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
noq = { version = "1.4", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
pkarr = { version = "8.1", default-features = false, features = ["dht"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"

[[bin]]
name = "aurum-social-worker"
path = "src/main.rs"

[[bin]]
name = "aurum-social-lab"
path = "src/lab.rs"
